<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الحقوق المالية</title>
<meta name="theme-color" content="#0f5c4d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f5f4; --card:#fff; --ink:#1c2826; --muted:#6b7a77; --line:#e1e7e5;
  --brand:#0f5c4d; --brand2:#137a66;
  --green:#15803d; --green-bg:#e7f6ec; --red:#c0262d; --red-bg:#fdecec;
  --amber:#b45309; --amber-bg:#fff4e0;
  --brand-ink:#0f5c4d; --tint:var(--tint); --soft:var(--soft); --soft2:var(--soft2); --input:var(--input); --track:var(--track);
  --ink2:var(--ink2); --blue:#2b5797; --blue-bg:#e8eef6; --toast-bg:#1c2826; --toast-ink:#fff;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1715; --card:#18221f; --ink:#e6eeec; --muted:#93a39f; --line:#2a3733; --brand2:#1a8a73;
  --green:#4ade80; --green-bg:#14321f; --red:#f87171; --red-bg:#3a1a1b; --amber:#fbbf24; --amber-bg:#3a2c12;
  --brand-ink:#5fd3b8; --tint:#1d3530; --soft:#22302c; --soft2:#1e2a27; --input:#141d1b; --track:#2a3733;
  --ink2:#b8c6c2; --blue:#8fb4ee; --blue-bg:#1c2940; --toast-bg:#e6eeec; --toast-ink:#0f1715; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1715; --card:#18221f; --ink:#e6eeec; --muted:#93a39f; --line:#2a3733; --brand2:#1a8a73;
  --green:#4ade80; --green-bg:#14321f; --red:#f87171; --red-bg:#3a1a1b; --amber:#fbbf24; --amber-bg:#3a2c12;
  --brand-ink:#5fd3b8; --tint:#1d3530; --soft:#22302c; --soft2:#1e2a27; --input:#141d1b; --track:#2a3733;
  --ink2:#b8c6c2; --blue:#8fb4ee; --blue-bg:#1c2940; --toast-bg:#e6eeec; --toast-ink:#0f1715; color-scheme:dark }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;font-size:16px}
body{min-height:100vh;padding-bottom:90px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* الشريط العلوي */
header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:16px 16px 18px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .row{display:flex;align-items:center;gap:10px}
header h1{font-size:20px;flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.15);color:#fff;font-size:20px;display:grid;place-items:center}

main{max-width:640px;margin:0 auto;padding:14px 16px}

/* بطاقات الملخص */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sum .box{background:var(--card);border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.sum .lbl{font-size:13px;color:var(--muted)}
.sum .val{font-size:20px;font-weight:700;margin-top:4px}
.sum .net{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.g{color:var(--green)} .r{color:var(--red)}

.alert{background:var(--red-bg);color:var(--red);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:600;font-size:14px}

.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chip{white-space:nowrap;padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}

/* قائمة الأشخاص */
.person{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;width:100%;text-align:right}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--tint);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.person .info{flex:1;min-width:0}
.person .name{font-weight:700}
.person .meta{font-size:13px;color:var(--muted);margin-top:2px}
.person .bal{text-align:left;font-weight:700;font-size:15px}
.person .bal small{display:block;font-weight:400;font-size:12px}
.tag-late{color:var(--red);font-weight:600}

.empty{text-align:center;color:var(--muted);padding:40px 10px;line-height:1.9}

/* صفحة الشخص */
.phead{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.phead .top{display:flex;align-items:center;gap:12px}
.phead h2{font-size:19px}
.phead .net{margin-top:12px;padding:10px 12px;border-radius:10px;font-weight:700;text-align:center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{padding:12px;border-radius:12px;font-weight:700;text-align:center;display:block;width:100%;text-decoration:none}
.btn.pri{background:var(--brand);color:#fff}
.btn.sec{background:var(--tint);color:var(--brand-ink)}
.btn.wa{background:#1fa855;color:#fff}
.btn.danger{background:var(--red-bg);color:var(--red)}
.btn.full{grid-column:1/-1}
.smallbtn{padding:7px 12px;border-radius:10px;font-size:14px;font-weight:600;background:var(--soft)}
.smallbtn.pri{background:var(--brand);color:#fff}
.smallbtn.danger{color:var(--red);background:var(--red-bg)}

.entry{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.entry.done{opacity:.7}
.entry .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;padding:3px 10px;border-radius:12px;font-weight:700}
.badge.li{background:var(--green-bg);color:var(--green)}
.badge.alay{background:var(--red-bg);color:var(--red)}
.badge.late{background:var(--red);color:var(--card)}
.badge.ok{background:var(--blue-bg);color:var(--blue)}
.entry .reason{font-weight:700;flex:1}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0;text-align:center}
.nums div{background:var(--soft2);border-radius:10px;padding:6px 4px}
.nums small{display:block;color:var(--muted);font-size:12px}
.nums b{font-size:15px}
.bar{height:6px;background:var(--track);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand2)}
.dates{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.7}
.dates .late{color:var(--red);font-weight:700}
.notes{font-size:13px;margin-top:6px;color:var(--ink2);white-space:pre-wrap}
.pays{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.pays .p{display:flex;align-items:center;gap:8px;font-size:14px;padding:4px 0}
.pays .p span{flex:1}
.pays .x{color:var(--red);font-size:13px;padding:2px 8px}
.ebtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.up{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.up h4{padding:12px 14px 6px;font-size:15px}
.uprow{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);width:100%;text-align:right}
.uprow .info{flex:1;min-width:0}
.uprow .name{font-weight:700;font-size:15px}
.uprow .meta{font-size:12px;color:var(--muted);margin-top:2px}
.uprow .amt{font-weight:700;font-size:15px;text-align:left;white-space:nowrap}
.when{font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.when.late{background:var(--red-bg);color:var(--red)}
.when.today{background:var(--amber-bg);color:var(--amber)}
.up .more{padding:8px 14px 12px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.listsum{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:14px}
.listsum b{font-variant-numeric:tabular-nums}
.psplit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;font-size:13px;text-align:center}
.psplit div{background:var(--soft2);border-radius:10px;padding:6px}
.inst{margin-top:8px}
.inst summary{cursor:pointer;font-size:14px;color:var(--brand-ink);font-weight:700;padding:4px 0}
.inst .row{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.inst .row span:first-child{flex:1}
.toggle button.on.pl{border-color:var(--brand2);background:var(--tint);color:var(--brand-ink)}
.calbtns{display:grid;gap:8px;margin-top:14px}
.drv{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:10px;line-height:1.7}
.drv .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.drv .dot.on{background:var(--green)}
.drv .dot.err{background:var(--red)}
.bklist{display:grid;gap:6px;margin:10px 0}
.bklist button{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--input);text-align:right}
.sec-title{font-size:15px;color:var(--muted);margin:16px 2px 8px;font-weight:700}

/* زر الإضافة العائم */
.fab{position:fixed;left:18px;bottom:22px;background:var(--brand);color:#fff;border-radius:30px;padding:14px 22px;font-weight:700;font-size:16px;box-shadow:0 6px 18px rgba(15,92,77,.35);z-index:6}

/* النوافذ */
.sheet .msg{line-height:1.9;white-space:pre-line}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px 24px;max-height:92vh;overflow-y:auto}
.sheet h3{font-size:18px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--input)}
.field textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toggle button{padding:12px;border-radius:12px;border:2px solid var(--line);font-weight:700}
.toggle button.on.li{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.toggle button.on.alay{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.err{color:var(--red);font-size:14px;margin-bottom:10px;font-weight:600}
.sheet .actions{margin-top:16px}

/* شاشة القفل */
#lock{position:fixed;inset:0;background:linear-gradient(160deg,var(--brand),#0a3d33);color:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#lock h2{font-size:22px;margin-bottom:6px}
#lock p{opacity:.85;margin-bottom:22px;min-height:22px;text-align:center}
.dots{display:flex;gap:16px;margin-bottom:30px;direction:ltr}
.dots span{width:16px;height:16px;border-radius:50%;border:2px solid #fff}
.dots span.f{background:#fff}
.dots.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;direction:ltr}
.pad button{height:76px;border-radius:50%;background:rgba(255,255,255,.13);color:#fff;font-size:28px;font-weight:600}
.pad button:active{background:rgba(255,255,255,.3)}
.pad .blank{visibility:hidden}
#lock .forgot{margin-top:26px;color:#fff;opacity:.8;text-decoration:underline;font-size:14px}

/* الإعدادات */
.set{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.set h4{margin-bottom:6px}
.set p{font-size:14px;color:var(--muted);margin-bottom:10px;line-height:1.7}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-ink);padding:10px 18px;border-radius:20px;font-size:14px;z-index:70}

/* الطباعة */
#print{display:none}
@media print{
  body{background:#fff;padding:0}
  header,main,.fab,.overlay,.toast,#lock{display:none!important}
  #print{display:block;padding:10px;font-size:13px}
  #print h2{font-size:18px;margin-bottom:4px}
  #print table{width:100%;border-collapse:collapse;margin-top:10px}
  #print th,#print td{border:1px solid #999;padding:6px;text-align:right}
  #print th{background:#eee}
  #print .tot{margin-top:12px;font-weight:700;font-size:15px}
}
</style>
</head>
<body>

<div id="lock">
  <h2 id="lockTitle">الحقوق المالية</h2>
  <p id="lockMsg"></p>
  <div class="dots" id="dots"><span></span><span></span><span></span><span></span></div>
  <div class="pad" id="pad"></div>
  <button class="forgot" id="forgotBtn">نسيت الرمز؟</button>
</div>

<header>
  <div class="row">
    <button class="iconbtn hidden" id="backBtn" aria-label="رجوع">→</button>
    <h1 id="title">الحقوق المالية</h1>
    <button class="iconbtn" id="setBtn" aria-label="الإعدادات">⚙</button>
  </div>
</header>

<main id="app"></main>
<button class="fab" id="fab">+ حق جديد</button>
<div id="print"></div>

<script>
/* ============ التخزين ============ */
var KEY = 'huquq-data-v1';
var db = loadDb();
function loadDb(){
  try{ var d = JSON.parse(localStorage.getItem(KEY)); if(d && d.people && d.entries) return d; }catch(e){}
  return {people:[], entries:[], pin:null};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('تعذّر الحفظ على هذا الجهاز'); } }
var PREVIEW = !!window.HUQUQ_PREVIEW; // نسخة التجربة على claude.ai: بدون طباعة ولا تنزيل ملفات
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ============ أدوات ============ */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function round2(n){ return Math.round(n*100)/100; }
function money(n){ return round2(n).toLocaleString('en-US',{maximumFractionDigits:2}) + ' ريال'; }
function today(){ var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function fmtDate(s){
  if(!s) return '';
  var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0];
}
function hashPin(p){ var h=5381; p='huquq:'+p; for(var i=0;i<p.length;i++){ h=((h<<5)+h+p.charCodeAt(i))|0; } return 'h'+(h>>>0).toString(36); }
function toast(msg){
  var t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2200);
}

/* ============ الحسابات ============ */
function paid(e){ return round2(e.payments.reduce(function(s,p){return s+p.amount;},0)); }
function remaining(e){ return round2(e.amount - paid(e)); }
/* الأقساط: e.plan = {count, freq:'monthly'|'weekly', start:'YYYY-MM-DD'} — الجدول يُحسب ولا يُخزَّن،
   والدفعات تُوزَّع على الأقساط بالترتيب (الأقدم أولًا) */
function addPeriod(start, i, freq){
  var p = start.split('-').map(Number);
  if(freq==='weekly') return new Date(Date.UTC(p[0],p[1]-1,p[2]+7*i)).toISOString().slice(0,10);
  var m = p[1]-1+i, y = p[0]+Math.floor(m/12); m = ((m%12)+12)%12;
  var last = new Date(Date.UTC(y,m+1,0)).getUTCDate();
  return new Date(Date.UTC(y,m,Math.min(p[2],last))).toISOString().slice(0,10);
}
function addDays(s, n){ var p = s.split('-').map(Number); return new Date(Date.UTC(p[0],p[1]-1,p[2]+n)).toISOString().slice(0,10); }
function installments(e){
  if(!e.plan) return null;
  var n = e.plan.count, base = Math.floor(e.amount/n*100)/100, left = paid(e), list = [];
  for(var i=0;i<n;i++){
    var amt = i===n-1 ? round2(e.amount - base*(n-1)) : base;
    var cov = round2(Math.min(amt, Math.max(0,left))); left = round2(left-amt);
    list.push({n:i+1, of:n, date:addPeriod(e.plan.start,i,e.plan.freq), amount:amt, paid:cov, rest:round2(amt-cov)});
  }
  return list;
}
function nextInst(e){ var l = installments(e); if(!l) return null; for(var i=0;i<l.length;i++) if(l[i].rest>0) return l[i]; return null; }
function dueOf(e){ if(remaining(e)<=0) return ''; if(e.plan){ var x = nextInst(e); return x ? x.date : ''; } return e.due || ''; }
function isLate(e){ var d = dueOf(e); return !!d && d < today(); }
/* المبلغ المطلوب الآن: للأقساط = المتأخر مع القسط القادم، وإلا المتبقي كله */
function dueAmount(e){
  if(!e.plan) return remaining(e);
  var nx = nextInst(e); if(!nx) return 0;
  var lim = nx.date < today() ? today() : nx.date;
  return round2(installments(e).filter(function(x){ return x.date<=lim; }).reduce(function(a,x){ return a+x.rest; },0));
}
function daysUntil(s){ return Math.round((new Date(s+'T00:00:00Z') - new Date(today()+'T00:00:00Z'))/86400000); }
/* العدد مع المعدود بالعربية: 1 واحد، 2 مثنى، 3-10 جمع، 11+ مفرد منصوب */
function countTxt(n, one, two, few, many){ var m = n%100; return n===1?one:n===2?two:(m>=3&&m<=10)?n+' '+few:n+' '+many; }
function daysTxt(n){ return countTxt(n,'يوم','يومين','أيام','يومًا'); }
function whenLabel(s){
  var d = daysUntil(s);
  if(d<0) return 'متأخر '+daysTxt(-d);
  if(d===0) return 'اليوم'; if(d===1) return 'غدًا';
  if(d>30) return 'قادم';
  return 'بعد '+daysTxt(d);
}
function whenCls(s){ var d = daysUntil(s); return d<0?'late':(d===0?'today':''); }
function freqTxt(f){ return f==='weekly'?'كل أسبوع':'كل شهر'; }
function instCount(p){ return countTxt(p.count,'قسط واحد','قسطان','أقساط','قسطًا')+' '+freqTxt(p.freq); }
/* المواعيد خلال عدد من الأيام القادمة (مع المتأخر) */
function upcoming(days){
  var lim = addDays(today(), days), out = [];
  db.entries.forEach(function(e){
    var d = dueOf(e); if(!d || d>lim) return;
    var p = personById(e.personId); if(!p) return;
    var nx = e.plan ? nextInst(e) : null;
    out.push({e:e, p:p, date:d, amount:dueAmount(e), label: nx ? 'القسط '+nx.n+' من '+nx.of : 'موعد السداد'});
  });
  return out.sort(function(a,b){ return a.date.localeCompare(b.date); });
}
function personById(id){ return db.people.find(function(p){return p.id===id;}); }
function entriesOf(pid){ return db.entries.filter(function(e){return e.personId===pid;}); }
function personStats(pid){
  var li=0, alay=0, late=0, open=0;
  entriesOf(pid).forEach(function(e){
    var r = remaining(e); if(r<=0) return;
    open++; if(e.type==='li') li+=r; else alay+=r;
    if(isLate(e)) late++;
  });
  return {li:round2(li), alay:round2(alay), net:round2(li-alay), late:late, open:open};
}
function totals(){
  var li=0, alay=0, late=0;
  db.entries.forEach(function(e){
    var r = remaining(e); if(r<=0) return;
    if(e.type==='li') li+=r; else alay+=r;
    if(isLate(e)) late++;
  });
  return {li:round2(li), alay:round2(alay), net:round2(li-alay), late:late};
}

/* ============ الحالة والتنقل ============ */
var state = {view:'home', filter:'all', q:'', personId:null};
function go(view, personId){
  state.view = view; if(personId!==undefined) state.personId = personId;
  render(); window.scrollTo(0,0);
}
$('backBtn').onclick = function(){ go('home'); };
$('setBtn').onclick = function(){ go('settings'); };
$('fab').onclick = function(){ openEntryForm(null, state.view==='person' ? state.personId : null); };

function render(){
  var isHome = state.view==='home';
  $('backBtn').classList.toggle('hidden', isHome);
  $('setBtn').classList.toggle('hidden', !isHome);
  $('fab').classList.toggle('hidden', state.view==='settings');
  if(state.view==='person' && !personById(state.personId)) state.view='home';
  if(state.view==='home') renderHome();
  else if(state.view==='person') renderPerson();
  else renderSettings();
}

/* ============ الرئيسية ============ */
function renderHome(){
  $('title').textContent = 'الحقوق المالية';
  var t = totals();
  var html = '<div class="sum">'+
    '<div class="box"><div class="lbl">لي عند الناس</div><div class="val g">'+money(t.li)+'</div></div>'+
    '<div class="box"><div class="lbl">علي للناس</div><div class="val r">'+money(t.alay)+'</div></div>'+
    '<div class="box net"><div class="lbl">الصافي</div><div class="val '+(t.net>=0?'g':'r')+'">'+
      (t.net===0?'متعادل':(t.net>0?'لك ':'عليك ')+money(Math.abs(t.net)))+'</div></div>'+
  '</div>';
  if(t.late) html += '<div class="alert">⚠ يوجد '+t.late+' '+(t.late===1?'حق متأخر':'حقوق متأخرة')+' عن موعد السداد</div>';
  var up = upcoming(14);
  if(up.length){
    html += '<div class="up"><h4>القادم خلال أسبوعين</h4>'+up.slice(0,6).map(function(x){
      return '<button class="uprow" data-p="'+x.p.id+'"><span class="when '+whenCls(x.date)+'">'+whenLabel(x.date)+'</span>'+
        '<div class="info"><div class="name">'+esc(x.p.name)+'</div><div class="meta">'+esc(x.label)+' · '+fmtDate(x.date)+(x.e.reason?' · '+esc(x.e.reason):'')+'</div></div>'+
        '<div class="amt '+(x.e.type==='li'?'g':'r')+'">'+money(x.amount)+'<div class="meta">'+(x.e.type==='li'?'تستلمه':'تدفعه')+'</div></div></button>';
    }).join('')+(up.length>6?'<div class="more">و'+countTxt(up.length-6,'موعد آخر','موعدان آخران','مواعيد أخرى','موعدًا آخر')+'، تجدها في صفحات الأشخاص</div>':'')+'</div>';
  }

  html += '<input class="search" id="q" placeholder="ابحث باسم الشخص..." value="'+esc(state.q)+'">';
  var chips = [['all','الكل'],['li','لي عندهم'],['alay','علي لهم'],['late','متأخر'],['done','مسدَّد بالكامل']];
  html += '<div class="chips">'+chips.map(function(c){
    return '<button class="chip'+(state.filter===c[0]?' on':'')+'" data-f="'+c[0]+'">'+c[1]+'</button>';
  }).join('')+'</div>';

  var list = db.people.map(function(p){ return {p:p, s:personStats(p.id), n:entriesOf(p.id).length}; });
  list = list.filter(function(x){
    if(state.q && x.p.name.indexOf(state.q.trim())<0) return false;
    if(state.filter==='li') return x.s.li>0;
    if(state.filter==='alay') return x.s.alay>0;
    if(state.filter==='late') return x.s.late>0;
    if(state.filter==='done') return x.s.open===0 && x.n>0;
    return true;
  });
  list.sort(function(a,b){ return (b.s.late-a.s.late) || (Math.abs(b.s.net)-Math.abs(a.s.net)); });
  if(list.length){
    var sLi=0, sAl=0, sLate=0;
    list.forEach(function(x){
      sLi+=x.s.li; sAl+=x.s.alay;
      entriesOf(x.p.id).forEach(function(e){ if(isLate(e)) sLate += dueAmount(e); });
    });
    var cnt = countTxt(list.length,'شخص واحد','شخصان','أشخاص','شخصًا');
    var sumHtml;
    if(state.filter==='li') sumHtml = '<span>مجموع ما لي عندهم ('+cnt+')</span><b class="g">'+money(sLi)+'</b>';
    else if(state.filter==='alay') sumHtml = '<span>مجموع ما علي لهم ('+cnt+')</span><b class="r">'+money(sAl)+'</b>';
    else if(state.filter==='late') sumHtml = '<span>مجموع المتأخر ('+cnt+')</span><b class="r">'+money(sLate)+'</b>';
    else if(state.filter==='done') sumHtml = '<span>مسدَّد بالكامل</span><b>'+cnt+'</b>';
    else sumHtml = '<span>مجموع القائمة ('+cnt+')</span><span>لي <b class="g">'+money(sLi)+'</b> · علي <b class="r">'+money(sAl)+'</b></span>';
    html += '<div class="listsum">'+sumHtml+'</div>';
  }

  if(!db.people.length){
    html += '<div class="empty">لا توجد حقوق مسجلة بعد.<br>اضغط زر <b>«+ حق جديد»</b> في أسفل الشاشة لإضافة أول حق.</div>';
  } else if(!list.length){
    html += '<div class="empty">لا توجد نتائج.</div>';
  } else {
    html += list.map(function(x){
      var s=x.s, bal;
      if(s.open===0) bal='<span style="color:var(--muted)">مسدَّد</span>';
      else if(s.net>0) bal='<span class="g">'+money(s.net)+'<small>لي عنده</small></span>';
      else if(s.net<0) bal='<span class="r">'+money(-s.net)+'<small>علي له</small></span>';
      else bal='<span>متعادل</span>';
      var meta = s.open ? (s.open+' '+(s.open===1?'حق مفتوح':'حقوق مفتوحة')) : 'لا يوجد مفتوح';
      if(s.late) meta += ' · <span class="tag-late">'+s.late+' متأخر</span>';
      return '<button class="person" data-p="'+x.p.id+'"><div class="avatar">'+esc(x.p.name.trim().charAt(0))+'</div>'+
        '<div class="info"><div class="name">'+esc(x.p.name)+'</div><div class="meta">'+meta+'</div></div>'+
        '<div class="bal">'+bal+'</div></button>';
    }).join('');
  }
  $('app').innerHTML = html;

  var q = $('q');
  q.oninput = function(){ state.q = q.value; var pos=q.selectionStart; renderHome(); var nq=$('q'); nq.focus(); nq.setSelectionRange(pos,pos); };
  document.querySelectorAll('.chip').forEach(function(b){ b.onclick=function(){ state.filter=b.dataset.f; renderHome(); }; });
  document.querySelectorAll('.person,.uprow').forEach(function(b){ b.onclick=function(){ go('person', b.dataset.p); }; });
}

/* ============ صفحة الشخص ============ */
function renderPerson(){
  var p = personById(state.personId), s = personStats(p.id);
  $('title').textContent = p.name;
  var netTxt, netCls;
  if(s.open===0){ netTxt='كل الحقوق مسدَّدة'; netCls='background:var(--soft);color:var(--muted)'; }
  else if(s.net>0){ netTxt='الصافي: لي عنده '+money(s.net); netCls='background:var(--green-bg);color:var(--green)'; }
  else if(s.net<0){ netTxt='الصافي: علي له '+money(-s.net); netCls='background:var(--red-bg);color:var(--red)'; }
  else { netTxt='الصافي: متعادل'; netCls='background:var(--soft)'; }

  var html = '<div class="phead"><div class="top"><div class="avatar">'+esc(p.name.trim().charAt(0))+'</div>'+
    '<div style="flex:1"><h2>'+esc(p.name)+'</h2><div class="hint" style="direction:ltr;text-align:right">'+esc(p.phone||'بدون رقم جوال')+'</div></div>'+
    '<button class="smallbtn" id="editP">تعديل</button></div>'+
    '<div class="net" style="'+netCls+'">'+netTxt+'</div>'+
    (s.li>0 && s.alay>0 ? '<div class="psplit"><div>لي عنده<br><b class="g">'+money(s.li)+'</b></div><div>علي له<br><b class="r">'+money(s.alay)+'</b></div></div>' : '')+
    '<div class="actions">'+
      '<button class="btn pri full" id="addE">+ حق جديد مع '+esc(p.name)+'</button>'+
      '<a class="btn wa'+(PREVIEW?' full':'')+'" id="waBtn" target="_blank" rel="noopener" href="'+esc(waUrl(p))+'">إرسال واتساب</a>'+
      (PREVIEW?'':'<button class="btn sec" id="prBtn">كشف حساب للطباعة</button>')+
    '</div></div>';

  var es = entriesOf(p.id).slice().sort(function(a,b){
    var ra=remaining(a)>0, rb=remaining(b)>0; if(ra!==rb) return ra?-1:1;
    return (b.date||'').localeCompare(a.date||'');
  });
  if(!es.length) html += '<div class="empty">لا توجد حقوق مسجلة مع هذا الشخص.</div>';
  var shownDone=false;
  es.forEach(function(e){
    var r = remaining(e), pd = paid(e), done = r<=0;
    if(done && !shownDone){ html += '<div class="sec-title">مسدَّدة بالكامل</div>'; shownDone=true; }
    var pct = e.amount>0 ? Math.min(100, pd/e.amount*100) : 0;
    html += '<div class="entry'+(done?' done':'')+'"><div class="t">'+
      '<span class="badge '+e.type+'">'+(e.type==='li'?'لي عنده':'علي له')+'</span>'+
      '<span class="reason">'+esc(e.reason||'بدون وصف')+'</span>'+
      (done?'<span class="badge ok">مسدَّد ✓</span>':'')+(isLate(e)?'<span class="badge late">متأخر</span>':'')+
    '</div>'+
    '<div class="nums"><div><small>المبلغ</small><b>'+money(e.amount)+'</b></div>'+
      '<div><small>المسدَّد</small><b>'+money(pd)+'</b></div>'+
      '<div><small>المتبقي</small><b class="'+(r>0?(e.type==='li'?'g':'r'):'')+'">'+money(Math.max(0,r))+'</b></div></div>'+
    '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
    '<div class="dates">'+datesLine(e)+'</div>'+
    (e.notes?'<div class="notes">'+esc(e.notes)+'</div>':'')+instTable(e);
    if(e.payments.length){
      html += '<div class="pays"><div class="hint" style="margin-bottom:4px">الدفعات:</div>'+
        e.payments.slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'');}).map(function(py){
          return '<div class="p"><span>'+fmtDate(py.date)+' — <b>'+money(py.amount)+'</b>'+(py.note?' ('+esc(py.note)+')':'')+'</span>'+
            '<button class="x" data-delpay="'+e.id+'|'+py.id+'">حذف</button></div>';
        }).join('')+'</div>';
    }
    html += '<div class="ebtns">'+
      (done?'':'<button class="smallbtn pri" data-pay="'+e.id+'">تسجيل دفعة</button>')+
      (!done && dueOf(e)?'<button class="smallbtn" data-cal="'+e.id+'">أضف للتقويم</button>':'')+
      '<button class="smallbtn" data-edit="'+e.id+'">تعديل</button>'+
      '<button class="smallbtn danger" data-del="'+e.id+'">حذف</button></div></div>';
  });
  $('app').innerHTML = html;

  $('editP').onclick = function(){ openPersonForm(p); };
  $('addE').onclick = function(){ openEntryForm(null, p.id); };
  if($('prBtn')) $('prBtn').onclick = function(){ printStatement(p); };
  document.querySelectorAll('[data-pay]').forEach(function(b){ b.onclick=function(){ openPayForm(b.dataset.pay); }; });
  document.querySelectorAll('[data-edit]').forEach(function(b){ b.onclick=function(){ openEntryForm(b.dataset.edit); }; });
  document.querySelectorAll('[data-cal]').forEach(function(b){ b.onclick=function(){ openCalendar(b.dataset.cal); }; });
  document.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(){
    ask('هل تريد حذف هذا الحق مع كل دفعاته؟', 'نعم، احذف', function(){
      db.entries = db.entries.filter(function(e){return e.id!==b.dataset.del;}); cleanupPeople(); save(); render(); toast('تم الحذف');
    });
  }; });
  document.querySelectorAll('[data-delpay]').forEach(function(b){ b.onclick=function(){
    var ids = b.dataset.delpay.split('|'), e = db.entries.find(function(x){return x.id===ids[0];});
    if(!e) return;
    ask('هل تريد حذف هذه الدفعة؟', 'نعم، احذف', function(){
      e.payments = e.payments.filter(function(py){return py.id!==ids[1];}); save(); render(); toast('تم حذف الدفعة');
    });
  }; });
}

function datesLine(e){
  var h = 'تاريخ الحق: '+fmtDate(e.date), d = dueOf(e);
  if(e.plan){
    h += ' · '+instCount(e.plan);
    var nx = nextInst(e);
    if(nx) h += '<br>القسط القادم ('+nx.n+' من '+nx.of+'): <b>'+money(nx.rest)+'</b> بتاريخ <span class="'+(isLate(e)?'late':'')+'">'+fmtDate(nx.date)+' ('+whenLabel(nx.date)+')</span>';
  } else if(e.due){
    h += ' · موعد السداد: <span class="'+(isLate(e)?'late':'')+'">'+fmtDate(e.due)+(d?' ('+whenLabel(d)+')':'')+'</span>';
  }
  return h;
}
function instTable(e){
  var l = installments(e); if(!l) return '';
  var done = l.filter(function(x){return x.rest<=0;}).length;
  return '<details class="inst"><summary>جدول الأقساط ('+done+' من '+l.length+' مدفوعة)</summary>'+l.map(function(x){
    var st;
    if(x.rest<=0) st = '<span class="badge ok">مدفوع ✓</span>';
    else if(x.date<today()) st = '<span class="badge late">متأخر'+(x.paid>0?' · باقي '+money(x.rest):'')+'</span>';
    else if(x.paid>0) st = '<span class="when">جزئي · باقي '+money(x.rest)+'</span>';
    else st = '<span class="when '+whenCls(x.date)+'">'+whenLabel(x.date)+'</span>';
    return '<div class="row"><span>القسط '+x.n+' · '+fmtDate(x.date)+' · <b>'+money(x.amount)+'</b></span>'+st+'</div>';
  }).join('')+'</details>';
}

/* ============ النوافذ ============ */
function sheet(html){
  closeSheet();
  var o = document.createElement('div'); o.className='overlay'; o.id='ov';
  o.innerHTML = '<div class="sheet">'+html+'</div>';
  o.addEventListener('click', function(ev){ if(ev.target===o) closeSheet(); });
  document.body.appendChild(o);
  return o;
}
function closeSheet(){ var o=$('ov'); if(o) o.remove(); }
function ask(msg, okLabel, cb, safe){
  sheet('<h3>تأكيد</h3><p class="msg">'+esc(msg)+'</p>'+
    '<div class="actions"><button class="btn '+(safe?'pri':'danger')+'" id="askOk">'+esc(okLabel)+'</button><button class="btn sec" id="askNo">إلغاء</button></div>');
  $('askOk').onclick = function(){ closeSheet(); cb(); };
  $('askNo').onclick = closeSheet;
}
function info(msg, title){
  sheet('<h3>'+esc(title||'تنبيه')+'</h3><p class="msg">'+esc(msg)+'</p><div class="actions"><button class="btn pri full" id="infoOk">حسنًا</button></div>');
  $('infoOk').onclick = closeSheet;
}

function openEntryForm(entryId, presetPersonId){
  var e = entryId ? db.entries.find(function(x){return x.id===entryId;}) : null;
  var p = e ? personById(e.personId) : (presetPersonId ? personById(presetPersonId) : null);
  var type = e ? e.type : 'li';
  var plan = e && e.plan ? e.plan : null, usePlan = !!plan;
  var names = db.people.map(function(x){return '<option value="'+esc(x.name)+'">';}).join('');
  sheet('<h3>'+(e?'تعديل الحق':'حق جديد')+'</h3><div class="err hidden" id="fErr"></div>'+
    '<div class="field"><label>نوع الحق</label><div class="toggle" id="typeTg">'+
      '<button type="button" class="li'+(type==='li'?' on':'')+'" data-t="li">لي عنده (أستحقه)</button>'+
      '<button type="button" class="alay'+(type==='alay'?' on':'')+'" data-t="alay">علي له (أدين به)</button></div></div>'+
    '<div class="field"><label>اسم الشخص</label><input id="fName" list="namesList" autocomplete="off" value="'+esc(p?p.name:'')+'" placeholder="اكتب الاسم أو اختر من القائمة"><datalist id="namesList">'+names+'</datalist></div>'+
    '<div class="field" id="phoneWrap"><label>رقم جواله (اختياري — لإرسال واتساب)</label><input id="fPhone" type="tel" inputmode="tel" dir="ltr" placeholder="05xxxxxxxx" value="'+esc(p?p.phone||'':'')+'"></div>'+
    '<div class="field"><label>المبلغ (ريال)</label><input id="fAmount" type="number" inputmode="decimal" min="0" step="0.01" value="'+(e?e.amount:'')+'"></div>'+
    '<div class="field"><label>السبب / الوصف</label><input id="fReason" value="'+esc(e?e.reason:'')+'" placeholder="مثال: قرض، ثمن سيارة، إيجار..."></div>'+
    '<div class="field"><label>طريقة السداد</label><div class="toggle" id="planTg">'+
      '<button type="button" class="pl'+(plan?'':' on')+'" data-m="once">دفعة واحدة</button>'+
      '<button type="button" class="pl'+(plan?' on':'')+'" data-m="plan">على أقساط</button></div></div>'+
    '<div class="two"><div class="field"><label>تاريخ الحق</label><input id="fDate" type="date" value="'+(e?e.date:today())+'"></div>'+
      '<div class="field" id="dueWrap"><label>موعد السداد (اختياري)</label><input id="fDue" type="date" value="'+(e&&e.due?e.due:'')+'"></div></div>'+
    '<div id="planBox">'+
      '<div class="two"><div class="field"><label>عدد الأقساط</label><input id="fCount" type="number" inputmode="numeric" min="2" max="360" step="1" value="'+(plan?plan.count:'')+'" placeholder="مثال: 12"></div>'+
        '<div class="field"><label>قسط كل</label><select id="fFreq"><option value="monthly"'+(plan&&plan.freq==='weekly'?'':' selected')+'>شهر</option><option value="weekly"'+(plan&&plan.freq==='weekly'?' selected':'')+'>أسبوع</option></select></div></div>'+
      '<div class="field"><label>تاريخ أول قسط</label><input id="fStart" type="date" value="'+(plan?plan.start:addPeriod(today(),1,'monthly'))+'"></div>'+
      '<div class="hint" id="planHint" style="margin:-4px 0 12px"></div>'+
    '</div>'+
    '<div class="field"><label>ملاحظات (اختياري)</label><textarea id="fNotes">'+esc(e?e.notes:'')+'</textarea></div>'+
    '<div class="actions"><button class="btn pri" id="fSave">حفظ</button><button class="btn sec" id="fCancel">إلغاء</button></div>');

  document.querySelectorAll('#typeTg button').forEach(function(b){ b.onclick=function(){
    type=b.dataset.t; document.querySelectorAll('#typeTg button').forEach(function(x){x.classList.toggle('on', x===b);});
  }; });
  function syncPlan(){
    $('planBox').classList.toggle('hidden', !usePlan); $('dueWrap').classList.toggle('hidden', usePlan);
    var a = parseFloat($('fAmount').value), n = parseInt($('fCount').value,10);
    $('planHint').textContent = (usePlan && a>0 && n>=2) ? 'قيمة القسط: '+money(Math.floor(a/n*100)/100)+' '+($('fFreq').value==='weekly'?'كل أسبوع':'كل شهر')+'، وآخر قسط بتاريخ '+fmtDate(addPeriod($('fStart').value||today(), n-1, $('fFreq').value)) : '';
  }
  document.querySelectorAll('#planTg button').forEach(function(b){ b.onclick=function(){
    usePlan = b.dataset.m==='plan'; document.querySelectorAll('#planTg button').forEach(function(x){x.classList.toggle('on', x===b);}); syncPlan();
  }; });
  ['fAmount','fCount','fFreq','fStart'].forEach(function(id){ $(id).addEventListener('input', syncPlan); $(id).addEventListener('change', syncPlan); });
  syncPlan();
  $('fName').oninput = function(){
    var ex = db.people.find(function(x){return x.name===$('fName').value.trim();});
    if(ex && !$('fPhone').value) $('fPhone').value = ex.phone||'';
  };
  $('fCancel').onclick = closeSheet;
  $('fSave').onclick = function(){
    var name=$('fName').value.trim(), amount=parseFloat($('fAmount').value), err=$('fErr');
    function fail(m){ err.textContent=m; err.classList.remove('hidden'); }
    if(!name) return fail('اكتب اسم الشخص.');
    if(!(amount>0)) return fail('اكتب مبلغًا صحيحًا أكبر من صفر.');
    if(e && amount < paid(e)) return fail('المبلغ أقل من المسدَّد ('+money(paid(e))+'). احذف بعض الدفعات أولًا.');
    var newPlan = null;
    if(usePlan){
      var cnt = parseInt($('fCount').value,10);
      if(!(cnt>=2 && cnt<=360)) return fail('اكتب عدد الأقساط (من 2 إلى 360).');
      if(!$('fStart').value) return fail('اختر تاريخ أول قسط.');
      newPlan = {count:cnt, freq:$('fFreq').value, start:$('fStart').value};
    }
    var phone=$('fPhone').value.trim();
    var person = db.people.find(function(x){return x.name===name;});
    if(!person){ person={id:uid(), name:name, phone:phone}; db.people.push(person); }
    else if(phone) person.phone = phone;
    var data = {type:type, personId:person.id, amount:round2(amount), reason:$('fReason').value.trim(),
      date:$('fDate').value||today(), due:usePlan?'':($('fDue').value||''), plan:newPlan, notes:$('fNotes').value.trim()};
    if(e){ Object.assign(e, data); }
    else { data.id=uid(); data.payments=[]; data.created=Date.now(); db.entries.push(data); }
    cleanupPeople(); save(); closeSheet();
    state.personId = person.id; state.view='person'; render(); toast(e?'تم حفظ التعديل':'تمت إضافة الحق');
  };
}

function openPayForm(entryId){
  var e = db.entries.find(function(x){return x.id===entryId;}), r = remaining(e), nx = nextInst(e);
  var def = e.plan ? Math.min(r, dueAmount(e) || (nx?nx.rest:r)) : r;
  sheet('<h3>تسجيل دفعة</h3><div class="hint" style="margin-bottom:12px;line-height:1.8">'+esc(e.reason||'')+' — المتبقي كله: <b>'+money(r)+'</b>'+
    (nx?'<br>القسط القادم ('+nx.n+' من '+nx.of+') بتاريخ '+fmtDate(nx.date)+': <b>'+money(nx.rest)+'</b>'+(def>nx.rest?'، ومع المتأخر: <b>'+money(def)+'</b>':''):'')+'</div>'+
    '<div class="err hidden" id="pErr"></div>'+

/* ============ واتساب والطباعة ============ */
function waPhone(ph){
  var d = String(ph||'').replace(/[^\d]/g,'');
  if(!d) return '';
  if(d.indexOf('00')===0) d=d.slice(2);
  if(d.indexOf('05')===0 && d.length===10) d='966'+d.slice(1);
  else if(d.indexOf('5')===0 && d.length===9) d='966'+d;
  return d;
}
function waDue(e){
  var nx = nextInst(e);
  if(e.plan && nx) return ' — القسط القادم ('+nx.n+' من '+nx.of+'): '+money(nx.rest)+' بتاريخ '+fmtDate(nx.date);
  return e.due ? ' — موعد السداد '+fmtDate(e.due) : '';
}
function waUrl(p){
  var es = entriesOf(p.id).filter(function(e){return remaining(e)>0;});
  var s = personStats(p.id);
  var lines = ['السلام عليكم ورحمة الله وبركاته','','ملخص الحقوق المالية بيننا:'];
  if(!es.length) lines.push('لا توجد حقوق متبقية بيننا، والحمد لله.');
  es.forEach(function(e){
    lines.push('• '+(e.reason||'حق')+' بتاريخ '+fmtDate(e.date)+': المبلغ '+money(e.amount)+
      (paid(e)>0?'، المسدَّد '+money(paid(e)):'')+'، المتبقي '+money(remaining(e))+
      ' ('+(e.type==='li'?'لي عندك':'لك عندي')+')'+waDue(e));
  });
  if(es.length){
    lines.push('');
    if(s.net>0) lines.push('الصافي: لي عندك '+money(s.net));
    else if(s.net<0) lines.push('الصافي: لك عندي '+money(-s.net));
    else lines.push('الصافي: متعادل');
  }
  var ph = waPhone(p.phone);
  return 'https://wa.me/'+ph+'?text='+encodeURIComponent(lines.join('\n'));
}
function printStatement(p){
  var es = entriesOf(p.id).slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'');});
  var s = personStats(p.id);
  var rows = es.map(function(e){
    return '<tr><td>'+fmtDate(e.date)+'</td><td>'+esc(e.reason||'')+'</td><td>'+(e.type==='li'?'لي عنده':'علي له')+'</td>'+
      '<td>'+money(e.amount)+'</td><td>'+money(paid(e))+'</td><td>'+money(Math.max(0,remaining(e)))+'</td><td>'+(e.plan?instCount(e.plan)+(dueOf(e)?'، القادم '+fmtDate(dueOf(e)):''):(e.due?fmtDate(e.due):'-'))+'</td></tr>'+
      e.payments.map(function(py){ return '<tr><td>'+fmtDate(py.date)+'</td><td colspan="6">↳ دفعة: '+money(py.amount)+(py.note?' — '+esc(py.note):'')+'</td></tr>'; }).join('');
  }).join('');
  $('print').innerHTML = '<h2>كشف حساب: '+esc(p.name)+'</h2><div>تاريخ الكشف: '+fmtDate(today())+(p.phone?' · الجوال: '+esc(p.phone):'')+'</div>'+
    '<table><tr><th>التاريخ</th><th>الوصف</th><th>النوع</th><th>المبلغ</th><th>المسدَّد</th><th>المتبقي</th><th>موعد السداد</th></tr>'+rows+'</table>'+
    '<div class="tot">إجمالي ما لي عنده: '+money(s.li)+' · إجمالي ما علي له: '+money(s.alay)+' · الصافي: '+
      (s.net>0?'لي عنده '+money(s.net):s.net<0?'علي له '+money(-s.net):'متعادل')+'</div>';

/* ============ التقويم ============ */
function calItems(e){
  var p = personById(e.personId), who = (e.type==='li'?'استلام من ':'دفع إلى ')+p.name;
  if(e.plan){
    return installments(e).filter(function(x){return x.rest>0;}).map(function(x){
      return {date:x.date, n:x.n, title:who+' — قسط '+x.n+' من '+x.of+': '+money(x.rest)};
    });
  }
  var d = dueOf(e); return d ? [{date:d, n:0, title:who+' — '+money(remaining(e))}] : [];
}
function ymd(s){ return s.split('-').join(''); }
function googleCalUrl(e){
  var it = calItems(e); if(!it.length) return '';
  var p = personById(e.personId), first = it[0];
  var title = e.plan ? (e.type==='li'?'استلام قسط من ':'دفع قسط إلى ')+p.name+': '+money(installments(e)[0].amount) : first.title;
  var u = 'https://calendar.google.com/calendar/render?action=TEMPLATE'+
    '&text='+encodeURIComponent(title)+
    '&dates='+ymd(first.date)+'/'+ymd(addDays(first.date,1))+
    '&details='+encodeURIComponent('من تطبيق الحقوق المالية'+(e.reason?'\nالسبب: '+e.reason:''));
  if(e.plan && it.length>1) u += '&recur='+encodeURIComponent('RRULE:FREQ='+(e.plan.freq==='weekly'?'WEEKLY':'MONTHLY')+';COUNT='+it.length);
  return u;
}
function icsEsc(t){ return String(t).replace(/\\/g,'\\\\').replace(/[,;]/g,function(c){return '\\'+c;}); }
function icsText(e){
  var it = calItems(e), now = new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  var L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//huquq//ar','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  it.forEach(function(x){
    var t = icsEsc(x.title);
    L.push('BEGIN:VEVENT','UID:'+e.id+'-'+x.n+'@huquq','DTSTAMP:'+now,
      'DTSTART;VALUE=DATE:'+ymd(x.date),'DTEND;VALUE=DATE:'+ymd(addDays(x.date,1)),
      'SUMMARY:'+t,'DESCRIPTION:'+icsEsc('الحقوق المالية'+(e.reason?' - '+e.reason:'')),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+t,'TRIGGER:-PT15H','END:VALARM',
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+t,'TRIGGER:PT9H','END:VALARM',
      'END:VEVENT');
  });
  L.push('END:VCALENDAR'); return L.join('\r\n');
}
function openCalendar(id){
  var e = db.entries.find(function(x){return x.id===id;}), it = calItems(e);

/* ============ النسخ الاحتياطي إلى Google Drive ============
   - مفتاح الربط GOOGLE_CLIENT_ID من مشروع Google Cloud (نوع Web، والمصدر المسموح https://naser2777.github.io)
   - الصلاحية drive.file: التطبيق يرى فقط الملفات التي أنشأها هو، داخل مجلد DRIVE_FOLDER
   - النسخ التلقائي عند فتح التطبيق إذا مرّت 12 ساعة على آخر نسخة (لا يعمل التطبيق وهو مغلق)
   - يُحتفظ بآخر 30 نسخة ويُحذف الأقدم */
var GOOGLE_CLIENT_ID = '';
var DRIVE_FOLDER = 'الحقوق المالية - نسخ احتياطية';
var DRIVE_EVERY = 12*3600*1000, DRIVE_KEEP = 30, BK_KEY = 'huquq-drive';
function bkGet(){ try{ return JSON.parse(localStorage.getItem(BK_KEY)) || {}; }catch(e){ return {}; } }
function bkSet(o){ try{ localStorage.setItem(BK_KEY, JSON.stringify(o)); }catch(e){} }
function bkPatch(p){ var b = bkGet(); for(var k in p) b[k] = p[k]; bkSet(b); return b; }
var gisLoading = null;
function loadGis(){
  if(window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  if(gisLoading) return gisLoading;
  gisLoading = new Promise(function(res, rej){
    var sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
    sc.onload = res; sc.onerror = function(){ gisLoading = null; rej(new Error('لا يوجد اتصال بالإنترنت')); };
    document.head.appendChild(sc);
  });
  return gisLoading;
}
function getToken(interactive){
  var b = bkGet();
  if(b.token && b.tokenExp > Date.now()) return Promise.resolve(b.token);
  return loadGis().then(function(){ return new Promise(function(res, rej){
    var c = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file',
      prompt: interactive ? 'select_account' : '',
      callback: function(r){
        if(r.error) return rej(new Error(r.error));
        bkPatch({token:r.access_token, tokenExp:Date.now()+(Number(r.expires_in||3600)-120)*1000});
        res(r.access_token);
      },
      error_callback: function(err){ rej(new Error(err && err.type==='popup_closed' ? 'أُغلقت نافذة Google قبل الإكمال' : 'لم تُفتح نافذة Google')); }
    });
    c.requestAccessToken();
  }); });
}
function gfetch(token, url, opt){
  opt = opt || {}; opt.headers = Object.assign({Authorization:'Bearer '+token}, opt.headers || {});
  return fetch(url, opt).then(function(r){
    if(r.status===401) bkPatch({token:null});
    if(!r.ok){ var er = new Error('رد Google: '+r.status); er.status = r.status; throw er; }
    return r;
  });
}
var GD = 'https://www.googleapis.com/drive/v3/files';
function ensureFolder(token){
  var b = bkGet(); if(b.folderId) return Promise.resolve(b.folderId);
  var q = encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='"+DRIVE_FOLDER+"' and trashed=false");
  return gfetch(token, GD+'?q='+q+'&fields=files(id)').then(function(r){ return r.json(); }).then(function(j){
    if(j.files && j.files.length) return j.files[0].id;
    return gfetch(token, GD+'?fields=id', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:DRIVE_FOLDER, mimeType:'application/vnd.google-apps.folder'})})
      .then(function(r){ return r.json(); }).then(function(j2){ return j2.id; });
  }).then(function(id){ bkPatch({folderId:id}); return id; });
}
function stampNow(){
  var d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,16).replace('T',' ').replace(':','-');
}
function backupJson(){ return JSON.stringify({app:'huquq', version:3, exported:new Date().toISOString(), people:db.people, entries:db.entries}); }
function listBackups(token, fid){
  var q = encodeURIComponent("'"+fid+"' in parents and trashed=false");
  return gfetch(token, GD+'?q='+q+'&orderBy=createdTime desc&pageSize=100&fields=files(id,name,createdTime)')
    .then(function(r){ return r.json(); }).then(function(j){ return j.files || []; });
}
function uploadBackup(token, fid){
  var bd = 'huquq'+Date.now();
  var body = '--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+
    JSON.stringify({name:'نسخة '+stampNow()+'.json', parents:[fid], mimeType:'application/json'})+
    '\r\n--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+backupJson()+'\r\n--'+bd+'--';
  return gfetch(token, 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
    {method:'POST', headers:{'Content-Type':'multipart/related; boundary='+bd}, body:body});
}
function driveBackup(interactive){
  return getToken(interactive).then(function(token){
    function go2(retry){
      return ensureFolder(token).then(function(fid){
        return uploadBackup(token, fid).then(function(){
          return listBackups(token, fid).then(function(files){
            return Promise.all(files.slice(DRIVE_KEEP).map(function(f){ return gfetch(token, GD+'/'+f.id, {method:'DELETE'}).catch(function(){}); }));
          });
        });
      }).catch(function(e){
        if(retry && e.status===404){ bkPatch({folderId:null}); return go2(false); } // المجلد حُذف من Drive
        throw e;
      });
    }
    return go2(true);
  }).then(function(){ bkPatch({connected:true, lastAt:Date.now(), lastErr:''}); })
    .catch(function(e){ bkPatch({lastErr:String(e.message||e)}); throw e; });
}
function autoBackup(){
  var b = bkGet();
  if(PREVIEW || !GOOGLE_CLIENT_ID || !b.connected) return;
  if(b.lastAt && Date.now()-b.lastAt < DRIVE_EVERY) return;
  if(navigator.onLine===false) return;
  driveBackup(false).then(function(){ toast('تم النسخ الاحتياطي إلى Google Drive ✓'); })
    .catch(function(){ toast('تعذّر النسخ إلى Drive، افتح الإعدادات للتفاصيل'); });
}
function fmtTime(ms){
  var d = new Date(ms), p = function(n){ return (n<10?'0':'')+n; };
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' الساعة '+p(d.getHours())+':'+p(d.getMinutes());
}
function driveSection(){
  if(PREVIEW) return '<div class="set"><h4>Google Drive</h4><p>النسخ الاحتياطي التلقائي إلى Google Drive يعمل في نسخة الجوال المثبَّتة فقط.</p></div>';
  if(!GOOGLE_CLIENT_ID) return '<div class="set"><h4>Google Drive</h4><p>الربط بـ Google Drive سيعمل بعد إضافة مفتاح Google إلى التطبيق.</p></div>';
  var b = bkGet(), h = '<div class="set"><h4>النسخ الاحتياطي إلى Google Drive</h4>';
  if(b.connected){
    h += '<div class="drv"><span class="dot '+(b.lastErr?'err':'on')+'"></span><span>متصل. '+(b.lastAt?'آخر نسخة: '+fmtTime(b.lastAt):'لم تُرفع نسخة بعد')+
      (b.lastErr?'<br><span class="r">آخر محاولة لم تنجح: '+esc(b.lastErr)+'</span>':'')+'</span></div>'+
      '<p>تُرفع نسخة تلقائيًا عند فتح التطبيق إذا مرّت 12 ساعة على آخر نسخة، ويُحتفظ بآخر '+DRIVE_KEEP+' نسخة في مجلد «'+DRIVE_FOLDER+'».</p>'+
      '<div class="actions"><button class="btn pri" id="drvNow">انسخ الآن</button><button class="btn sec" id="drvRestore">استرجاع من Drive</button>'+
      '<button class="btn danger full" id="drvOff">إلغاء الربط</button></div>';
  } else {
    h += '<p>اربط التطبيق بحسابك في Google Drive لتُرفع نسخة من بياناتك تلقائيًا عند فتح التطبيق مرتين في اليوم. التطبيق لا يرى في Drive إلا الملفات التي ينشئها هو.</p>'+
      '<button class="btn pri" id="drvOn">ربط Google Drive</button>';
  }
  return h + '</div>';
}
function bindDrive(){
  function busy(id, txt){ var el = $(id); if(el){ el.disabled = true; el.textContent = txt; } }
  if($('drvOn')) $('drvOn').onclick = function(){
    busy('drvOn','جارٍ الربط...');
    driveBackup(true).then(function(){ toast('تم الربط ورُفعت أول نسخة ✓'); renderSettings(); })
      .catch(function(e){ renderSettings(); info('لم يكتمل الربط: '+(e.message||e)+'\nتأكد من اتصال الإنترنت ثم حاول مرة أخرى.'); });
  };
  if($('drvNow')) $('drvNow').onclick = function(){
    busy('drvNow','جارٍ الرفع...');
    driveBackup(true).then(function(){ toast('تم رفع النسخة ✓'); renderSettings(); })
      .catch(function(){ renderSettings(); });
  };
  if($('drvRestore')) $('drvRestore').onclick = function(){
    busy('drvRestore','جارٍ التحميل...');
    getToken(true).then(function(token){
      return ensureFolder(token).then(function(fid){ return listBackups(token, fid); }).then(function(files){
        renderSettings();
        if(!files.length) return info('لا توجد نسخ في Drive بعد.');
        sheet('<h3>اختر النسخة</h3><p class="msg">الأحدث في الأعلى.</p><div class="bklist">'+files.slice(0,10).map(function(f){

        }).join('')+'</div><button class="btn sec full" id="bkNo">إلغاء</button>');
        $('bkNo').onclick = closeSheet;
        document.querySelectorAll('.bklist button').forEach(function(btn){ btn.onclick = function(){
          gfetch(token, GD+'/'+btn.dataset.f+'?alt=media').then(function(r){ return r.json(); }).then(function(d){
            if(d.app!=='huquq' || !Array.isArray(d.people) || !Array.isArray(d.entries)) throw new Error('bad');
            ask('سيتم استبدال البيانات الحالية بهذه النسخة ('+d.people.length+' شخص، '+d.entries.length+' حق). متابعة؟', 'نعم، استرجع', function(){
              db.people = d.people; db.entries = d.entries; save(); go('home'); toast('تم استرجاع النسخة');
            }, true);
          }).catch(function(){ info('تعذّر قراءة هذه النسخة.'); });
        }; });
      });
    }).catch(function(e){ renderSettings(); info('تعذّر الوصول إلى Drive: '+(e.message||e)); });
  };
  if($('drvOff')) $('drvOff').onclick = function(){
    ask('سيتوقف النسخ التلقائي إلى Drive. النسخ الموجودة في Drive تبقى كما هي.', 'إلغاء الربط', function(){
      var b = bkGet();
      try{ if(b.token && window.google && google.accounts) google.accounts.oauth2.revoke(b.token, function(){}); }catch(e){}
      bkSet({}); renderSettings(); toast('أُلغي الربط');
    });
  };
}

/* ============ الإعدادات ============ */
function renderSettings(){
  $('title').textContent = 'الإعدادات';
  $('app').innerHTML =
    '<div class="set"><h4>تغيير الرمز السري</h4><p>الرمز المكون من 4 أرقام الذي يُطلب عند فتح التطبيق.</p><button class="btn sec" id="chPin">تغيير الرمز</button></div>'+
    '<div class="set"><h4>قفل التطبيق الآن</h4><p>يُقفل التطبيق تلقائيًا أيضًا إذا خرجت منه أكثر من دقيقة.</p><button class="btn sec" id="lockNow">قفل الآن</button></div>'+
    driveSection()+
    (PREVIEW ? '<div class="set"><h4>نسخة احتياطية</h4><p>هذه نسخة تجربة. حفظ النسخة الاحتياطية وكشف الحساب للطباعة يعملان في نسخة الجوال المثبَّتة.</p></div>' :
    '<div class="set"><h4>نسخة احتياطية</h4><p>بياناتك محفوظة على هذا الجوال فقط. احفظ نسخة احتياطية من وقت لآخر حتى لا تضيع إذا تغيّر الجوال أو حُذف التطبيق.</p>'+
      '<div class="actions"><button class="btn pri" id="exp">حفظ نسخة احتياطية</button><button class="btn sec" id="imp">استرجاع نسخة</button></div>'+
      '<input type="file" id="impFile" accept=".json,application/json" class="hidden"></div>')+
    '<div class="set"><h4>حذف كل البيانات</h4><p>يحذف كل الأشخاص والحقوق والدفعات من هذا الجوال نهائيًا.</p><button class="btn danger" id="wipe">حذف كل البيانات</button></div>'+
    '<div class="hint" style="text-align:center;margin-top:16px">الحقوق المالية — الإصدار 3</div>';
  $('chPin').onclick = function(){ showLock('change'); };
  $('lockNow').onclick = function(){ showLock('enter'); };
  bindDrive();
  if(!PREVIEW){
    $('exp').onclick = exportData;
    $('imp').onclick = function(){ $('impFile').click(); };
    $('impFile').onchange = importData;
  }
  $('wipe').onclick = function(){
    ask('سيتم حذف كل الأشخاص والحقوق والدفعات نهائيًا من هذا الجهاز، ولا يمكن التراجع.\nهل أنت متأكد؟', 'نعم، احذف كل البيانات', function(){
      db.people=[]; db.entries=[]; save(); go('home'); toast('تم حذف كل البيانات');
    });
  };
}
function exportData(){
  var data = JSON.stringify({app:'huquq', version:1, exported:new Date().toISOString(), people:db.people, entries:db.entries}, null, 1);
  var blob = new Blob([data], {type:'application/json'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'الحقوق-المالية-نسخة-'+today()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
  toast('تم حفظ النسخة الاحتياطية');
}
function importData(ev){
  var f = ev.target.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var d = JSON.parse(rd.result);
      if(d.app!=='huquq' || !Array.isArray(d.people) || !Array.isArray(d.entries)) throw 0;
      ask('سيتم استبدال البيانات الحالية بما في النسخة ('+d.people.length+' شخص، '+d.entries.length+' حق). متابعة؟', 'نعم، استرجع', function(){
        db.people=d.people; db.entries=d.entries; save(); go('home'); toast('تم استرجاع النسخة');
      }, true);
    }catch(e){ info('هذا الملف ليس نسخة احتياطية صحيحة من تطبيق الحقوق المالية.'); }
  };
  rd.readAsText(f); ev.target.value='';
}

/* ============ القفل بالرمز ============ */
var lockMode='enter', pinBuf='', firstPin='';
function buildPad(){
  var keys=['1','2','3','4','5','6','7','8','9','','0','⌫'];
  $('pad').innerHTML = keys.map(function(k){ return '<button class="'+(k?'':'blank')+'" data-k="'+k+'">'+k+'</button>'; }).join('');
  $('pad').querySelectorAll('button').forEach(function(b){ b.onclick=function(){ pressKey(b.dataset.k); }; });
}
function showLock(mode){
  lockMode = mode; pinBuf=''; firstPin='';
  $('lock').classList.remove('hidden');
  $('forgotBtn').classList.toggle('hidden', mode!=='enter');
  setLockMsg();
  drawDots();
}
function setLockMsg(){
  var t = {enter:['الحقوق المالية','أدخل الرمز السري'], setup:['مرحبًا بك','اختر رمزًا سريًا من 4 أرقام لحماية بياناتك'],
    confirm:['تأكيد الرمز','أدخل الرمز نفسه مرة أخرى'], change:['تغيير الرمز','أدخل الرمز الحالي'],
    newpin:['الرمز الجديد','أدخل الرمز الجديد من 4 أرقام']}[lockMode];
  $('lockTitle').textContent=t[0]; $('lockMsg').textContent=t[1];
}
function drawDots(){ $('dots').querySelectorAll('span').forEach(function(s,i){ s.classList.toggle('f', i<pinBuf.length); }); }
function shake(msg){
  var d=$('dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
  $('lockMsg').textContent = msg; pinBuf=''; drawDots();
}
function pressKey(k){
  if(!k) return;
  if(k==='⌫'){ pinBuf=pinBuf.slice(0,-1); drawDots(); return; }
  if(pinBuf.length>=4) return;
  pinBuf+=k; drawDots();
  if(pinBuf.length<4) return;
  var pin=pinBuf;
  setTimeout(function(){
    if(lockMode==='enter'){
      if(hashPin(pin)===db.pin) unlock(); else shake('الرمز غير صحيح، حاول مرة أخرى');
    } else if(lockMode==='change'){
      if(hashPin(pin)===db.pin){ lockMode='newpin'; pinBuf=''; setLockMsg(); drawDots(); } else shake('الرمز الحالي غير صحيح');
    } else if(lockMode==='setup' || lockMode==='newpin'){
      firstPin=pin; lockMode='confirm'; pinBuf=''; setLockMsg(); drawDots();
    } else if(lockMode==='confirm'){
      if(pin===firstPin){ var wasNew=!db.pin; db.pin=hashPin(pin); save(); unlock(); toast(wasNew?'تم حفظ الرمز السري':'تم تغيير الرمز'); }
      else { lockMode = db.pin ? 'newpin' : 'setup'; firstPin=''; shake('الرمزان غير متطابقين، ابدأ من جديد'); }
    }
  }, 120);
}
function unlock(){ $('lock').classList.add('hidden'); pinBuf=''; render(); remindOnOpen(); autoBackup(); }
$('forgotBtn').onclick = function(){
  ask('لا يمكن استرجاع الرمز السري لأنه محفوظ على جهازك فقط.\n\nالحل الوحيد: مسح كل البيانات والرمز والبدء من جديد، ثم استرجاع آخر نسخة احتياطية حفظتها (إن وُجدت).\n\nستُحذف كل الحقوق المسجلة. متابعة؟', 'امسح كل شيء وابدأ من جديد', function(){
    db = {people:[], entries:[], pin:null}; save(); showLock('setup');
  });
};
var hiddenAt=0;
document.addEventListener('visibilitychange', function(){
  if(document.hidden) hiddenAt=Date.now();
  else if(db.pin && hiddenAt && Date.now()-hiddenAt>60000 && $('lock').classList.contains('hidden')){ closeSheet(); showLock('enter'); }
});

/* ============ البدء ============ */
buildPad();
render();
showLock(db.pin ? 'enter' : 'setup');
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
