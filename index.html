/* الالتزامات المجدولة (ما علي) في شهر معيّن */
function commitments(ym){
  var c = 0;
  db.people.forEach(function(p){ if(hasSched(p)) schedRows(p).forEach(function(r){ if(ymKey(r.date)===ym) c += r.amount; }); });
  db.entries.forEach(function(e){
    if(e.type==='li' || remaining(e)<=0) return;
    if(e.plan){ installments(e).forEach(function(x){ if(ymKey(x.date)===ym) c += x.amount; }); }
    else if(!hasSched(personById(e.personId)) && e.due && ymKey(e.due)===ym) c += remaining(e);
  });
  return round2(c);
}
/* دخل المصدر شهريًا: الثابت = مبلغه. المتغير = من المقبوضات (آخر 3 أشهر كاملة منذ أول قبض، والشهر الذي لا قبض فيه = 0)
   بالمتوسط أو بالأقل (أحوط)، وإن لم توجد أشهر كاملة فمقبوضات الشهر الحالي، وإلا التقدير المكتوب */
function incomeOf(src){
  if(src.kind!=='var') return {v:src.amount||0, how:'ثابت شهريًا'};
  var b = bud(), cur = today().slice(0,7), logs = b.inLog.filter(function(r){ return r.src===src.id; });
  if(!logs.length) return {v:src.amount||0, how: src.amount ? 'تقدير مكتوب' : 'لا مقبوضات بعد'};
  var first = logs.map(function(r){ return ymKey(r.date); }).sort()[0], months = [];
  for(var i=1; i<=3; i++){ var m = addMonthsYM(cur, -i); if(m >= first) months.push(m); }
  if(!months.length){ return {v:round2(logs.filter(function(r){ return ymKey(r.date)===cur; }).reduce(function(a,r){ return a+r.amount; },0)), how:'مقبوضات هذا الشهر'}; }
  var vals = months.map(function(m){ return logs.filter(function(r){ return ymKey(r.date)===m; }).reduce(function(a,r){ return a+r.amount; },0); });
  var v = b.incMode==='min' ? Math.min.apply(null, vals) : vals.reduce(function(a,x){ return a+x; },0)/vals.length;
  return {v:round2(v), how:(b.incMode==='min'?'الأقل خلال':'متوسط')+' '+countTxt(months.length,'شهر','شهرين','أشهر','شهرًا')};
}
function incTotals(){
  var fx = 0, vr = 0; bud().income.forEach(function(s2){ var v = incomeOf(s2).v; if(s2.kind==='var') vr += v; else fx += v; });
  return {fx:round2(fx), vr:round2(vr), all:round2(fx+vr)};
}
/* الخطة = بنود الخطة الشهرية (b.fixed) لكل فئة. الواقع = المصروفات المسجلة (b.exp). */
function planByCat(){ var o = {}; bud().fixed.forEach(function(x){ var c = x.cat||guessCat(x.name); o[c] = round2((o[c]||0) + x.amount); }); return o; }
function planTotal(){ return sumArr(bud().fixed); }
function actByCat(ym){ var o = {}; expOfMonth(ym).forEach(function(x){ o[x.cat] = round2((o[x.cat]||0) + x.amount); }); return o; }
function objSum(o){ return round2(Object.keys(o).reduce(function(a,k){ return a+o[k]; },0)); }
/* متوسط الصرف الفعلي: آخر 3 أشهر كاملة منذ أول تسجيل (الشهر الفارغ = 0)، وإلا تقدير من الشهر الحالي */
function actualAvg(){
  var b = bud(), cur = today().slice(0,7);
  if(b.exp.length){
    var first = b.exp.map(function(e){ return ymKey(e.date); }).sort()[0], ms = [];
    for(var i=1; i<=3; i++){ var m = addMonthsYM(cur,-i); if(m >= first) ms.push(m); }
    if(ms.length){
      var byCat = {}; ms.forEach(function(m){ var o = actByCat(m); Object.keys(o).forEach(function(k){ byCat[k] = (byCat[k]||0) + o[k]; }); });
      Object.keys(byCat).forEach(function(k){ byCat[k] = round2(byCat[k]/ms.length); });
      return {has:true, v:objSum(byCat), byCat:byCat, how:'متوسط '+countTxt(ms.length,'شهر','شهرين','أشهر','شهرًا')+' مسجّلة'};
    }
    var o = actByCat(cur), t = objSum(o);
    if(t>0){
      var d = Number(today().slice(8,10)), days = new Date(Number(cur.slice(0,4)), Number(cur.slice(5,7)), 0).getDate(), fct = days/Math.max(d,1);
      Object.keys(o).forEach(function(k){ o[k] = round2(o[k]*fct); });
      return {has:true, v:round2(t*fct), byCat:o, how:'تقدير من مصاريف هذا الشهر حتى الآن', partial:true};

function incActual(ym){ var b = bud(), v = 0; b.income.forEach(function(x){ if(x.kind!=='var') v += x.amount||0; }); b.inLog.forEach(function(r){ if(ymKey(r.date)===ym) v += r.amount; }); return round2(v); }
function finSummary(){
  var b = bud(), inc = incTotals().all, pt = planTotal(), aa = actualAvg();
  function net(x){ var free = round2(inc - x), m = free>0 ? round2(free*b.margin/100) : 0; return round2(free - m); }
  var ap = net(pt), aact = aa.has ? net(aa.v) : null;
  var avail = aact==null ? ap : Math.min(ap, aact);

/* مقترحات تحسين الخطة من مقارنة متوسط الواقع بالخطة */
function planSuggestions(){

  var h = '<div class="fcard"><h4><span>مصادر الدخل</span><b>'+money(t.all)+'</b></h4>';
  if(!b.income.length) h += '<div class="line">أضف كل مصدر دخل لك: راتب، تجارة، إيجار عقار، عمل حر... الثابت بمبلغه الشهري، والمتغير تسجّل ما تستلمه منه كل مرة.</div>';
  b.income.forEach(function(x){
    var io = incomeOf(x), isV = x.kind==='var';
    h += '<div class="isrc"><button class="n" data-inc="'+x.id+'">'+esc(x.name)+' <span class="kindpill '+(isV?'vr':'fx')+'">'+(isV?'متغير':'ثابت')+'</span><small>'+io.how+'</small></button>'+
      (isV?'<button class="smallbtn pri" data-rcv="'+x.id+'">+ استلام</button>':'')+'<b>'+money(io.v)+'</b></div>';
  });
  h += '<button class="smallbtn" style="margin-top:10px" id="bAdd_inc">+ '+(b.income.length?'إضافة مصدر دخل آخر':'إضافة مصدر دخل')+'</button>';
  if(hasVar){
    h += '<div class="field" style="margin-top:12px"><label>حساب الدخل المتغير</label><select id="bIncMode">'+
      '<option value="avg"'+(b.incMode!=='min'?' selected':'')+'>المتوسط</option><option value="min"'+(b.incMode==='min'?' selected':'')+'>الأقل (أحوط للخطة)</option></select></div>';
  }
  return h + '</div>';
}
function openIncomeForm(id){
  var b = bud(), x = id ? b.income.find(function(e){ return e.id===id; }) : null, kind = x ? (x.kind||'fixed') : 'fixed';
  sheet('<h3>'+(x?'تعديل مصدر دخل':'مصدر دخل جديد')+'</h3><div class="err hidden" id="nErr"></div>'+
    '<div class="field"><label>اسم المصدر</label><input id="nName" value="'+esc(x?x.name:'')+'" placeholder="مثال: راتب، محل، إيجار عقار، عمل حر"></div>'+
    '<div class="field"><label>نوع الدخل</label><div class="toggle" id="nKind">'+
      '<button type="button" class="pl'+(kind!=='var'?' on':'')+'" data-k="fixed">ثابت شهريًا</button>'+
      '<button type="button" class="pl'+(kind==='var'?' on':'')+'" data-k="var">متغير</button></div>'+
      '<div class="hint" id="nKindHint"></div></div>'+
    '<div class="field"><label id="nAmtLbl"></label><input id="nAmount" type="number" inputmode="decimal" min="0" step="0.01" value="'+(x&&x.amount?x.amount:'')+'"></div>'+
    '<div class="actions"><button class="btn pri" id="nSave">حفظ</button>'+(x?'<button class="btn danger" id="nDel">حذف</button>':'<button class="btn sec" id="nNo">إلغاء</button>')+'</div>');
  function sync(){
    var v = kind==='var';
    $('nAmtLbl').textContent = v ? 'تقدير شهري تقريبي (اختياري)' : 'المبلغ الشهري (ريال)';
    $('nKindHint').textContent = v ? 'تسجّل كل مبلغ تستلمه بزر «+ استلام»، ويحسب التطبيق دخلك الشهري منه. التقدير يُستعمل فقط حتى تسجّل مقبوضات.' : 'مبلغ ثابت يصلك كل شهر، مثل الراتب.';
  }
  document.querySelectorAll('#nKind button').forEach(function(bt){ bt.onclick = function(){ kind = bt.dataset.k; document.querySelectorAll('#nKind button').forEach(function(z){ z.classList.toggle('on', z===bt); }); sync(); }; });
  sync();
  if($('nNo')) $('nNo').onclick = closeSheet;
  $('nSave').onclick = function(){
    var n = $('nName').value.trim(), a = parseFloat($('nAmount').value), err = $('nErr');
    function fail(m){ err.textContent = m; err.classList.remove('hidden'); }
    if(!n) return fail('اكتب اسم المصدر.');
    if(kind!=='var' && !(a>0)) return fail('اكتب المبلغ الشهري.');
    var o = {name:n, kind:kind, amount: a>0 ? round2(a) : 0};
    if(x) Object.assign(x, o); else { o.id = uid(); b.income.push(o); }
    save(); closeSheet(); renderBudget(); toast('تم الحفظ');
    if(!x && kind==='var') setTimeout(function(){ openReceiptForm(o.id); }, 250);
  };
  if($('nDel')) $('nDel').onclick = function(){
    ask('حذف مصدر الدخل «'+x.name+'» ومقبوضاته المسجلة؟', 'نعم، احذف', function(){
      b.income = b.income.filter(function(e){ return e.id!==id; }); b.inLog = b.inLog.filter(function(r){ return r.src!==id; }); save(); renderBudget();
    });
  };
}
function openReceiptForm(srcId, rid){
  var b = bud(), src = b.income.find(function(z){ return z.id===srcId; }), r = rid ? b.inLog.find(function(z){ return z.id===rid; }) : null;
  if(!src) return;
  sheet('<h3>'+(r?'تعديل مبلغ مستلم':'استلام من «'+esc(src.name)+'»')+'</h3><div class="err hidden" id="rErr"></div>'+
    '<div class="two"><div class="field"><label>المبلغ (ريال)</label><input id="rAmount" type="number" inputmode="decimal" min="0" step="0.01" value="'+(r?r.amount:'')+'"></div>'+
      '<div class="field"><label>التاريخ</label><input id="rDate" type="date" value="'+(r?r.date:today())+'"></div></div>'+
    '<div class="field"><label>ملاحظة (اختياري)</label><input id="rNote" value="'+esc(r?r.note||'':'')+'" placeholder="مثال: أرباح الأسبوع، دفعة مشروع"></div>'+
    '<div class="actions"><button class="btn pri" id="rSave">حفظ</button>'+(r?'<button class="btn danger" id="rDel">حذف</button>':'<button class="btn sec" id="rNo">إلغاء</button>')+'</div>');
  if($('rNo')) $('rNo').onclick = closeSheet;
  $('rSave').onclick = function(){
    var a = parseFloat($('rAmount').value);
    if(!(a>0)){ $('rErr').textContent = 'اكتب المبلغ.'; $('rErr').classList.remove('hidden'); return; }
    var o = {amount:round2(a), date:$('rDate').value||today(), note:$('rNote').value.trim(), src:srcId};
    if(r) Object.assign(r, o); else { o.id = uid(); b.inLog.push(o); }
    save(); closeSheet(); renderBudget(); toast('تم تسجيل المبلغ');
  };
  if($('rDel')) $('rDel').onclick = function(){ ask('حذف هذا المبلغ؟', 'نعم، احذف', function(){ b.inLog = b.inLog.filter(function(z){ return z.id!==rid; }); save(); renderBudget(); }); };
}
function openMonthlyForm(kind, id){
  var b = bud(), arr = b[kind], x = id ? arr.find(function(e){ return e.id===id; }) : null, isFix = kind==='fixed';
  sheet('<h3>'+(isFix?(x?'تعديل بند في الخطة':'بند في الخطة الشهرية'):(x?'تعديل دخل':'دخل شهري'))+'</h3><div class="err hidden" id="mErr"></div>'+
    '<div class="field"><label>'+(isFix?'الوصف':'مصدر الدخل')+'</label><input id="mName" value="'+esc(x?x.name:'')+'" placeholder="'+(isFix?'مثال: إيجار، مواد غذائية، بنزين، كهرباء':'مثال: راتب')+'"><div class="autocat" id="mAuto"></div></div>'+
    '<div class="field"><label>'+(isFix?'المبلغ المخطط شهريًا (ريال)':'المبلغ الشهري (ريال)')+'</label><input id="mAmount" type="number" inputmode="decimal" min="0" step="0.01" value="'+(x?x.amount:'')+'"></div>'+
    (isFix?'<div class="field"><label>الفئة</label><select id="mCat">'+catOptions(x?(x.cat||guessCat(x.name)):'other')+'</select></div>':'')+
    '<div class="actions"><button class="btn pri" id="mSave">حفظ</button>'+(x?'<button class="btn danger" id="mDel">حذف</button>':'<button class="btn sec" id="mNo">إلغاء</button>')+'</div>');
  var manual = !!x;
  if(isFix){ $('mName').oninput = function(){ if(!manual) $('mCat').value = guessCat($('mName').value); $('mAuto').textContent = $('mName').value.trim() ? 'التصنيف التلقائي: '+catById(guessCat($('mName').value)).name : ''; }; $('mCat').onchange = function(){ manual = true; }; }
  if($('mNo')) $('mNo').onclick = closeSheet;
  $('mSave').onclick = function(){
    var n = $('mName').value.trim(), a = parseFloat($('mAmount').value), err = $('mErr');
    if(!n || !(a>0)){ err.textContent = 'اكتب الوصف والمبلغ.'; err.classList.remove('hidden'); return; }
    var o = {name:n, amount:round2(a)}; if(isFix) o.cat = $('mCat').value;
    if(x) Object.assign(x, o); else { o.id = uid(); arr.push(o); }
    save(); closeSheet(); renderBudget(); toast('تم الحفظ');
  };
  if($('mDel')) $('mDel').onclick = function(){ ask('حذف «'+x.name+'»؟', 'نعم، احذف', function(){ b[kind] = arr.filter(function(e){ return e.id!==id; }); save(); renderBudget(); }); };
}
/* يوزّع المتبقي الشهري على الديون غير المجدولة بنسبة كل دين، وينشئ جدولة سريعة لكل شخص */
function buildPlan(f){
  var b = bud(), cap = f.cap, list = f.uns.map(function(p){ var d = schedOwed(p); return {p:p, d:d, a:Math.max(1, Math.ceil(cap*d/f.owedUns))}; });
  var start = f.next+'-01';
  sheet('<h3>خطة السداد المقترحة</h3><p class="msg">'+money(cap)+' شهريًا تُوزَّع على '+countTxt(list.length,'شخص واحد','شخصين','أشخاص','شخصًا')+' بنسبة دين كل واحد، يوم '+b.payDay+' من كل شهر، ابتداءً من '+monthLabel(f.next)+':</p>'+
    '<div style="margin:10px 0">'+list.map(function(x){ var n = Math.ceil(x.d/x.a - 0.0001);
      return '<div class="lrow"><span class="n">'+esc(x.p.name)+'<small>الدين '+money(x.d)+' · '+countTxt(n,'دفعة واحدة','دفعتان','دفعات','دفعة')+'</small></span><b>'+money(x.a)+' / شهر</b></div>'; }).join('')+'</div>'+
    '<p class="hint">تُنشأ جدولة لكل شخص، وتصلك التنبيهات حسبها، وتستطيع تعديل أي جدولة من صفحة الشخص.</p>'+
    '<div class="actions"><button class="btn pri" id="plOk">اعتماد الخطة</button><button class="btn sec" id="plNo">إلغاء</button></div>');
  $('plNo').onclick = closeSheet;
  $('plOk').onclick = function(){
    list.forEach(function(x){
      x.p.sched = {mode:'quick', freq:'monthly', day:b.payDay, wday:0, start:start, amount:x.a,
        paidAtStart: round2(schedEntries(x.p).reduce(function(a,e){ return a+paid(e); },0))};
    });
    save(); closeSheet(); renderBudget(); toast('اعتُمدت الخطة لـ '+countTxt(list.length,'شخص واحد','شخصين','أشخاص','شخصًا'));
  };
}

/* ============ الإعدادات ============ */
function renderSettings(){
  $('title').textContent = 'الإعدادات';
  $('app').innerHTML =
    '<div class="set" id="ownerSet"><h4>بياناتك</h4><p>تظهر في رسائل الواتساب وكشوف الحساب التي ترسلها.</p>'+
      '<div class="field"><label>اسمك</label><input id="oName" value="'+esc(owner().name||'')+'" placeholder="مثال: نصر بن محمد"></div>'+
      '<div class="field"><label>جوالك (اختياري)</label><input id="oPhone" type="tel" dir="ltr" value="'+esc(owner().phone||'')+'" placeholder="05xxxxxxxx"></div>'+
      '<div class="field"><label>التوقيع في آخر الرسالة (اختياري)</label><textarea id="oSign" placeholder="مثال: أخوك المحب\nنصر بن محمد">'+esc(owner().sign||'')+'</textarea>'+
        '<div class="hint">إن تركته فارغًا يُكتب اسمك فقط.</div></div>'+
      '<div class="hint" id="oPrev" style="white-space:pre-line;background:var(--soft2);border-radius:10px;padding:10px;margin-bottom:12px"></div>'+
      '<button class="btn pri" id="oSave">حفظ بياناتي</button>'+
      '<div class="field" style="margin-top:16px"><label>التوقيع بخط اليد</label>'+
        '<div class="sigbox" id="sigPrev">'+(owner().sigImg?'<img src="'+owner().sigImg+'" alt="توقيعك">':'<span>لا يوجد توقيع بعد</span>')+'</div>'+
        '<div class="sigbtns"><button class="smallbtn pri" id="sigDraw">ارسم توقيعك</button><button class="smallbtn" id="sigUp">أرفق صورة أو PDF</button>'+
        (owner().sigImg?'<button class="smallbtn danger" id="sigDel">حذف التوقيع</button>':'')+'</div>'+
        '<input type="file" id="sigFile" accept="image/*,application/pdf" class="hidden">'+
        '<div class="hint">يظهر في كشف الحساب المطبوع، وفي «الكشف الموقّع» الذي ترسله صورةً.</div></div></div>'+
    '<div class="set"><h4>تغيير الرمز السري</h4><p>الرمز المكون من 4 أرقام الذي يُطلب عند فتح التطبيق.</p><button class="btn sec" id="chPin">تغيير الرمز</button></div>'+
    '<div class="set"><h4>قفل التطبيق الآن</h4><p>يُقفل التطبيق تلقائيًا أيضًا إذا خرجت منه أكثر من دقيقة.</p><button class="btn sec" id="lockNow">قفل الآن</button></div>'+
    driveSection()+
    (PREVIEW ? '<div class="set"><h4>نسخة احتياطية</h4><p>هذه نسخة تجربة. حفظ النسخة الاحتياطية وكشف الحساب للطباعة يعملان في نسخة الجوال المثبَّتة.</p></div>' :
    '<div class="set"><h4>نسخة احتياطية</h4><p>بياناتك محفوظة على هذا الجوال فقط. احفظ نسخة احتياطية من وقت لآخر حتى لا تضيع إذا تغيّر الجوال أو حُذف التطبيق.</p>'+
      '<div class="actions"><button class="btn pri" id="exp">حفظ نسخة احتياطية</button><button class="btn sec" id="imp">استرجاع نسخة</button></div>'+
      '<input type="file" id="impFile" accept=".json,application/json" class="hidden"></div>')+
    '<div class="set"><h4>حذف كل البيانات</h4><p>يحذف كل الأشخاص والحقوق والدفعات من هذا الجوال نهائيًا.</p><button class="btn danger" id="wipe">حذف كل البيانات</button></div>'+
    '<div class="hint" style="text-align:center;margin-top:16px">الحقوق المالية — الإصدار 14</div>';
  function ownerPrev(){
    var tmp = {name:$('oName').value.trim(), phone:$('oPhone').value.trim(), sign:$('oSign').value.trim()}, keep = db.owner;
    db.owner = tmp; var sg = signLines(); db.owner = keep;
    $('oPrev').textContent = 'هكذا تنتهي رسائلك:\n\nوجزاك الله خيرًا.'+(sg.length?'\n\n'+sg.join('\n'):'');
  }
  ['oName','oPhone','oSign'].forEach(function(id){ $(id).oninput = ownerPrev; }); ownerPrev();
  $('oSave').onclick = function(){
    db.owner = {name:$('oName').value.trim(), phone:$('oPhone').value.trim(), sign:$('oSign').value.trim(), sigImg:owner().sigImg||''};
    save(); toast('تم حفظ بياناتك');
  };
  bindSig();
  $('chPin').onclick = function(){ showLock('change'); };
  $('lockNow').onclick = function(){ showLock('enter'); };
  bindDrive();
  if(!PREVIEW){
    $('exp').onclick = exportData;
    $('imp').onclick = function(){ $('impFile').click(); };
    $('impFile').onchange = importData;
  }
  $('wipe').onclick = function(){
    ask('سيتم حذف كل الأشخاص والحقوق والدفعات نهائيًا من هذا الجهاز، ولا يمكن التراجع.\nهل أنت متأكد؟', 'نعم، احذف كل البيانات', function(){
      db.people=[]; db.entries=[]; save(); go('home'); toast('تم حذف كل البيانات');
    });
  };
}
function exportData(){
  var data = JSON.stringify({app:'huquq', version:1, exported:new Date().toISOString(), owner:db.owner||null, budget:db.budget||null, people:db.people, entries:db.entries}, null, 1);
  var blob = new Blob([data], {type:'application/json'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'الحقوق-المالية-نسخة-'+today()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
  toast('تم حفظ النسخة الاحتياطية');
}
function importData(ev){
  var f = ev.target.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var d = JSON.parse(rd.result);
      if(d.app!=='huquq' || !Array.isArray(d.people) || !Array.isArray(d.entries)) throw 0;
      ask('سيتم استبدال البيانات الحالية بما في النسخة ('+d.people.length+' شخص، '+d.entries.length+' حق). متابعة؟', 'نعم، استرجع', function(){
        db.people=d.people; db.entries=d.entries; if(d.owner) db.owner=d.owner; if(d.budget) db.budget=d.budget; save(); go('home'); toast('تم استرجاع النسخة');
      }, true);
    }catch(e){ info('هذا الملف ليس نسخة احتياطية صحيحة من تطبيق الحقوق المالية.'); }
  };
  rd.readAsText(f); ev.target.value='';
}

/* ============ القفل بالرمز ============ */
var lockMode='enter', pinBuf='', firstPin='';
function buildPad(){
  var keys=['1','2','3','4','5','6','7','8','9','','0','⌫'];
  $('pad').innerHTML = keys.map(function(k){ return '<button class="'+(k?'':'blank')+'" data-k="'+k+'">'+k+'</button>'; }).join('');
  $('pad').querySelectorAll('button').forEach(function(b){ b.onclick=function(){ pressKey(b.dataset.k); }; });
}
function showLock(mode){
  lockMode = mode; pinBuf=''; firstPin='';
  $('lock').classList.remove('hidden');
  $('forgotBtn').classList.toggle('hidden', mode!=='enter');
  setLockMsg();
  drawDots();
}
function setLockMsg(){
  var t = {enter:['الحقوق المالية','أدخل الرمز السري'], setup:['مرحبًا بك','اختر رمزًا سريًا من 4 أرقام لحماية بياناتك'],
    confirm:['تأكيد الرمز','أدخل الرمز نفسه مرة أخرى'], change:['تغيير الرمز','أدخل الرمز الحالي'],
    newpin:['الرمز الجديد','أدخل الرمز الجديد من 4 أرقام']}[lockMode];
  $('lockTitle').textContent=t[0]; $('lockMsg').textContent=t[1];
}
function drawDots(){ $('dots').querySelectorAll('span').forEach(function(s,i){ s.classList.toggle('f', i<pinBuf.length); }); }
function shake(msg){
  var d=$('dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
  $('lockMsg').textContent = msg; pinBuf=''; drawDots();
}
function pressKey(k){
  if(!k) return;
  if(k==='⌫'){ pinBuf=pinBuf.slice(0,-1); drawDots(); return; }
  if(pinBuf.length>=4) return;
  pinBuf+=k; drawDots();
  if(pinBuf.length<4) return;
  var pin=pinBuf;
  setTimeout(function(){
    if(lockMode==='enter'){
      if(hashPin(pin)===db.pin) unlock(); else shake('الرمز غير صحيح، حاول مرة أخرى');
    } else if(lockMode==='change'){
      if(hashPin(pin)===db.pin){ lockMode='newpin'; pinBuf=''; setLockMsg(); drawDots(); } else shake('الرمز الحالي غير صحيح');
    } else if(lockMode==='setup' || lockMode==='newpin'){
      firstPin=pin; lockMode='confirm'; pinBuf=''; setLockMsg(); drawDots();
    } else if(lockMode==='confirm'){
      if(pin===firstPin){ var wasNew=!db.pin; db.pin=hashPin(pin); save(); unlock(); toast(wasNew?'تم حفظ الرمز السري':'تم تغيير الرمز'); }
      else { lockMode = db.pin ? 'newpin' : 'setup'; firstPin=''; shake('الرمزان غير متطابقين، ابدأ من جديد'); }
    }
  }, 120);
}
function unlock(){ $('lock').classList.add('hidden'); pinBuf=''; render(); remindOnOpen(); autoBackup(); }
$('forgotBtn').onclick = function(){
  ask('لا يمكن استرجاع الرمز السري لأنه محفوظ على جهازك فقط.\n\nالحل الوحيد: مسح كل البيانات والرمز والبدء من جديد، ثم استرجاع آخر نسخة احتياطية حفظتها (إن وُجدت).\n\nستُحذف كل الحقوق المسجلة. متابعة؟', 'امسح كل شيء وابدأ من جديد', function(){
    db = {people:[], entries:[], pin:null}; save(); showLock('setup');
  });
};
var hiddenAt=0;
document.addEventListener('visibilitychange', function(){
  if(document.hidden) hiddenAt=Date.now();
  else if(db.pin && hiddenAt && Date.now()-hiddenAt>60000 && $('lock').classList.contains('hidden')){ closeSheet(); showLock('enter'); }
});

/* ============ البدء ============ */
buildPad();
render();
showLock(db.pin ? 'enter' : 'setup');
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  var hadSW = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(function(r){ r.update(); }).catch(function(){});
  // عند وصول تحديث جديد يُعاد تحميل التطبيق مرة واحدة تلقائيًا
  navigator.serviceWorker.addEventListener('controllerchange', function(){ if(!hadSW || reloaded) return; reloaded = true; location.reload(); });
}
